name: Arduino projects - ESP32-P4 Rev1.x

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sketch:
        description: "Arduino sketch directory name, path, or all"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: arduino-projects-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARDUINO_CORE_VERSION: "3.3.11"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  ARDUINO_FQBN: "esp32:esp32:esp32p4:ChipVariant=prev3,PSRAM=enabled,FlashSize=32M,FlashMode=qio,FlashFreq=80,PartitionScheme=app13M_data7M_32MB,USBMode=hwcdc,CDCOnBoot=cdc,UploadMode=default,UploadSpeed=921600"
  BSP_REFERENCE_VERSION: "3.0.1"
  BSP_REFERENCE_SOURCE_SHA: "bfeb6e6d5737178cdde78b630c8118074da0a657"
  BSP_REFERENCE_SOURCE_TREE: "7c12c7115599b4bb84072ad9ea68cc8c3e81b9c6"
  BSP_REFERENCE_COMPONENT_TREE: "eff6286f5bb97145fb43a33102b9dafdfa5f5c0b"
  BSP_REFERENCE_RELATIONSHIP: "reference-only"

jobs:
  discover:
    name: Route Arduino changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.route.outputs.arduino_matrix }}
      has_sketches: ${{ steps.route.outputs.has_arduino }}
      sketches: ${{ steps.route.outputs.arduino_sketches }}
      firmware_touched: ${{ steps.route.outputs.firmware_touched }}
      release_review: ${{ steps.route.outputs.release_review }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify repository changes
        id: route
        shell: bash
        env:
          MANUAL_SKETCH: ${{ inputs.sketch }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python .github/scripts/ci_change_router.py --manual-arduino "$MANUAL_SKETCH"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python .github/scripts/ci_change_router.py \
              --base-ref "${{ github.event.pull_request.base.sha }}" \
              --head-ref "${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              python .github/scripts/ci_change_router.py --all
            else
              python .github/scripts/ci_change_router.py \
                --base-ref "$before" --head-ref "${{ github.sha }}"
            fi
          fi

      - name: Summary
        shell: bash
        env:
          SELECTED_SKETCHES: ${{ steps.route.outputs.arduino_sketches }}
        run: |
          if [[ "${{ steps.route.outputs.has_arduino }}" == "true" ]]; then
            {
              echo "### Arduino Rev1.x sketches selected"
              echo
              printf '%s\n' "$SELECTED_SKETCHES" | tr ',' '\n' | sed '/^$/d' | sed 's/^/- /'
              echo
              echo "Each sketch is compiled for the 3.4C and 4C displays with ChipVariant=prev3."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Arduino sketch build was selected." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.sketch_name }} / Rev1.3 (${{ matrix.screen }})
    needs: discover
    if: needs.discover.outputs.has_sketches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino-ESP32
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@$ARDUINO_CORE_VERSION" \
            --additional-urls "$ESP32_INDEX_URL"

      - name: Verify ESP32-P4 Rev1.x profile
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARDUINO_FQBN" == *"ChipVariant=prev3"* ]]
          [[ "$ARDUINO_FQBN" != *"ChipVariant=postv3"* ]]
          echo "Verified Rev1.x FQBN: $ARDUINO_FQBN"

      - name: Compile sketch
        shell: bash
        env:
          SKETCH_NAME: ${{ matrix.sketch_name }}
          SKETCH_PATH: ${{ matrix.sketch }}
          SCREEN_NAME: ${{ matrix.screen }}
          SCREEN_DEFINE: ${{ matrix.screen_define }}
        run: |
          set -euo pipefail
          library_root="$GITHUB_WORKSPACE/examples/arduino/libraries"
          build_path="$RUNNER_TEMP/arduino-build/$SKETCH_NAME/$SCREEN_NAME"
          arduino-cli compile \
            --fqbn "$ARDUINO_FQBN" \
            --warnings all \
            --libraries "$library_root" \
            --build-path "$build_path" \
            --build-property "compiler.cpp.extra_flags=-DCURRENT_SCREEN=$SCREEN_DEFINE" \
            "$SKETCH_PATH"
          test -f "$build_path/flash_args"
          test -f "$build_path/build.options.json"

      - name: Package flashable Rev1.x artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          build_path="$RUNNER_TEMP/arduino-build/${{ matrix.sketch_name }}/${{ matrix.screen }}"
          artifact_name="ESP32-P4-WIFI6-Touch-LCD-XC-${{ matrix.variant_id }}-${{ matrix.sketch_name }}-arduino-${ARDUINO_CORE_VERSION}-rev1_3"
          package_dir="$RUNNER_TEMP/example-artifacts/$artifact_name"
          zip_output="$RUNNER_TEMP/example-artifacts/${artifact_name}.zip"

          test -f "$build_path/flash_args"
          test -f "$build_path/build.options.json"
          mkdir -p "$package_dir"
          cp -a "$build_path"/. "$package_dir"/

          # Arduino may record runner-absolute BIN paths. Make the package
          # portable by retaining only each image basename.
          sed -E 's#([^[:space:]]*/)([^/[:space:]]+\.bin)#\2#g' \
            "$build_path/flash_args" > "$package_dir/flash_args"
          cp "$package_dir/flash_args" "$package_dir/flash_args.txt"
          for image in $(tr ' ' '\n' < "$package_dir/flash_args" | sed -n '/\.bin$/p'); do
            test -f "$package_dir/$image"
          done

          printf '%s\n' \
            '@echo off' \
            'setlocal EnableExtensions EnableDelayedExpansion' \
            'cd /d "%~dp0"' \
            'if "%~1"=="" (' \
            '  echo Usage: flash.bat COMx' \
            '  exit /b 2' \
            ')' \
            'set "FLASH_ARGS="' \
            'for /f "usebackq delims=" %%A in ("flash_args") do set "FLASH_ARGS=!FLASH_ARGS! %%A"' \
            'python -m esptool --chip esp32p4 --port "%~1" --baud 921600 write_flash !FLASH_ARGS!' \
            'exit /b %ERRORLEVEL%' \
            > "$package_dir/flash.bat"

          printf '%s\n' \
            '#!/usr/bin/env sh' \
            'set -eu' \
            'if [ "$#" -ne 1 ]; then echo "Usage: ./flash.sh PORT"; exit 2; fi' \
            'cd "$(dirname "$0")"' \
            'python -m esptool --chip esp32p4 --port "$1" --baud 921600 write_flash $(cat flash_args)' \
            > "$package_dir/flash.sh"
          chmod +x "$package_dir/flash.sh"

          printf '%s\n' \
            "# $artifact_name" \
            '' \
            'Target: ESP32-P4 silicon revision before v3.00 (Rev1.x)' \
            "Display variant: ${{ matrix.variant }}" \
            "Resolution: ${{ matrix.resolution }}" \
            "Arduino-ESP32: $ARDUINO_CORE_VERSION" \
            "FQBN: $ARDUINO_FQBN" \
            "Git commit: $git_sha" \
            '' \
            'Install esptool: python -m pip install esptool' \
            'Windows: flash.bat COM21' \
            'Linux/macOS: ./flash.sh PORT' \
            > "$package_dir/README.md"

          test -n "$(find "$package_dir" -maxdepth 1 -type f -name '*.bin' -print -quit)"
          cd "$RUNNER_TEMP/example-artifacts"
          zip -qr "$zip_output" "$artifact_name"
          test -s "$zip_output"

          echo "name=${artifact_name}-${git_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "path=$zip_output" >> "$GITHUB_OUTPUT"

      - name: Upload flashable Rev1.x artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
