name: ESP-IDF projects - ESP32-P4 Rev1.x

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      project:
        description: "ESP-IDF project directory name, path, or all"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: esp-idf-projects-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-check:
    name: Repository self-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run repository self-check
        run: python .github/scripts/repo_self_check.py

  discover:
    name: Route ESP-IDF changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.route.outputs.idf_matrix }}
      has_projects: ${{ steps.route.outputs.has_idf }}
      projects: ${{ steps.route.outputs.idf_projects }}
      firmware_touched: ${{ steps.route.outputs.firmware_touched }}
      release_review: ${{ steps.route.outputs.release_review }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify repository changes
        id: route
        shell: bash
        env:
          MANUAL_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python .github/scripts/ci_change_router.py \
              --manual-idf "$MANUAL_PROJECT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python .github/scripts/ci_change_router.py \
              --base-ref "${{ github.event.pull_request.base.sha }}" \
              --head-ref "${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              python .github/scripts/ci_change_router.py --all
            else
              python .github/scripts/ci_change_router.py \
                --base-ref "$before" \
                --head-ref "${{ github.sha }}"
            fi
          fi

      - name: Summary
        shell: bash
        env:
          SELECTED_PROJECTS: ${{ steps.route.outputs.idf_projects }}
        run: |
          if [[ "${{ steps.route.outputs.has_idf }}" == "true" ]]; then
            {
              echo "### ESP-IDF Rev1.x projects selected"
              echo
              printf '%s\n' "$SELECTED_PROJECTS" | tr ',' '\n' | sed '/^$/d' | sed 's/^/- /'
              echo
              echo "Each selected project builds with ESP-IDF v5.5.5 and v6.0.2."
              echo "All builds are forced to config/ci/rev1_3.defaults."
              echo "Display projects build both 3.4C and 4C variants; USB also builds default and vendor-only configurations."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ESP-IDF example build was selected." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.route.outputs.firmware_touched }}" == "true" ]]; then
            echo "Maintained firmware changed; it remains outside the example matrix." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.route.outputs.release_review }}" == "true" ]]; then
            echo "Binary or archive changes require explicit release review." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.project_name }} / Rev1.3 / ${{ matrix.variant }} / ${{ matrix.configuration }} (${{ matrix.idf_version }})
    needs:
      - self-check
      - discover
    if: needs.discover.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare ESP32-P4 Rev1.x build command
        id: rev1-command
        shell: bash
        env:
          ORIGINAL_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          test -f config/ci/rev1_3.defaults

          command_text="${ORIGINAL_COMMAND//rev3_x.defaults/rev1_3.defaults}"
          if [[ "$command_text" != *"rev1_3.defaults"* ]]; then
            echo "ERROR: The generated build command does not select config/ci/rev1_3.defaults."
            echo "Original command: $ORIGINAL_COMMAND"
            exit 1
          fi
          if [[ "$command_text" == *"rev3_x.defaults"* ]]; then
            echo "ERROR: Rev3 defaults remain in the build command."
            exit 1
          fi

          {
            echo 'command<<EOF'
            echo "$command_text"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build with ESP-IDF Rev1.x profile
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32p4
          path: ${{ matrix.project }}
          command: ${{ steps.rev1-command.outputs.command }}

      - name: Package flashable Rev1.x example artifact
        id: package
        shell: bash
        env:
          ARTIFACT_KEY: ${{ matrix.artifact_key }}-rev1_3
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          output="$RUNNER_TEMP/example-artifacts/$ARTIFACT_KEY"
          python .github/scripts/package_build_artifact.py esp-idf \
            --build-dir "${{ matrix.project }}/build" --output-dir "$output" \
            --product-label "ESP32-P4-WIFI6-Touch-LCD-XC" --variant "${{ matrix.variant }}" \
            --variant-id "${{ matrix.variant_id }}" \
            --resolution "${{ matrix.resolution }}" --configuration "${{ matrix.configuration }}" \
            --framework-version "${{ matrix.idf_version }}" --target esp32p4 \
            --project "${{ matrix.project }}" --profile-id "rev1_3" \
            --sdkconfig "${{ matrix.project }}/sdkconfig" --git-sha "$git_sha"
          echo "name=${ARTIFACT_KEY}-${git_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload flashable Rev1.x example artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
